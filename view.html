<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Entry — Daily Knows</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dk-view-page">
  <header class="dk-header">
    <div class="dk-header-inner">
      <div class="dk-brand">
        <a href="index.html" class="dk-back-link" aria-label="Back to entries">←</a>
        <span class="dk-seal">☕</span>
        <h1 class="dk-title">Daily Knows</h1>
      </div>
      <div class="dk-actions">
        <button class="dk-icon-btn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
          <svg id="iconSun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg id="iconMoon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <button class="dk-btn dk-btn-ghost" id="editEntryBtn">Edit</button>
        <button class="dk-btn dk-btn-danger" id="deleteEntryBtn">Delete</button>
      </div>
    </div>
  </header>

  <main class="dk-view-main">
    <div id="loadingState" class="dk-view-state">Loading entry…</div>
    <article id="entryView" class="dk-entry-view" style="display:none">
      <div class="dk-view-meta">
        <span id="entryDate"></span>
        <span id="entryGregorian"></span>
        <span id="entryTag" class="dk-tag-chip"></span>
      </div>
      <h1 id="entryTitleView" class="dk-view-title"></h1>
      <div class="dk-highlight-help">Select text to highlight it. Click an existing highlight to remove it.</div>
      <div id="highlightToolbar" class="dk-highlight-toolbar" role="toolbar" aria-label="Text highlighting">
        <button id="highlightBtn" class="dk-btn dk-btn-primary">Highlight</button>
      </div>
      <div id="entryContent" class="dk-view-content" tabindex="0"></div>
    </article>
    <div id="errorState" class="dk-view-state" style="display:none">
      <h2>Entry not found</h2>
      <p>This entry may have been deleted or the link is invalid.</p>
      <a class="dk-btn dk-btn-primary" href="index.html">Back to entries</a>
    </div>
  </main>

  <div id="toastContainer" class="dk-toast-container" aria-live="polite"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDK933ay1nDa1ZA-KeYq3MP46ykPJG-G0o",
      authDomain: "dailyknows-43a88.firebaseapp.com",
      projectId: "dailyknows-43a88",
      storageBucket: "dailyknows-43a88.appspot.com",
      messagingSenderId: "435107214237",
      appId: "1:435107214237:web:e8939c15c7793316d33574",
      measurementId: "G-1HVS23R33J"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const id = new URLSearchParams(location.search).get("id");
    const loadingState = document.getElementById("loadingState");
    const errorState = document.getElementById("errorState");
    const entryView = document.getElementById("entryView");
    const content = document.getElementById("entryContent");
    const toolbar = document.getElementById("highlightToolbar");
    const highlightBtn = document.getElementById("highlightBtn");
    const editBtn = document.getElementById("editEntryBtn");
    const deleteBtn = document.getElementById("deleteEntryBtn");
    let entry = null;
    let selectionRange = null;

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      document.getElementById("iconSun").style.display = theme === "dark" ? "none" : "block";
      document.getElementById("iconMoon").style.display = theme === "dark" ? "block" : "none";
    }
    let theme = localStorage.getItem("dk-theme") || "light";
    applyTheme(theme);
    document.getElementById("themeToggle").addEventListener("click", () => {
      theme = theme === "dark" ? "light" : "dark";
      localStorage.setItem("dk-theme", theme);
      applyTheme(theme);
    });

    function dateStr(data) {
      const months = ["Meskerem","Tikimt","Hidar","Tahsas","Tir","Yekatit","Megabit","Miazia","Ginbot","Sene","Hamle","Nehase","Pagumen"];
      return `${data.day} ${months[(data.month || 1) - 1] || months[0]} ${data.year} EC`;
    }

    function formatGregorian(dateObj) {
      return new Intl.DateTimeFormat("en-US", { year: "numeric", month: "short", day: "numeric" }).format(dateObj);
    }

    function ethiopianToGregorian(ecYear, ecMonth, ecDay) {
      const start = new Date(ecYear + 7, 8, 11);
      const offset = (ecMonth - 1) * 30 + (ecDay - 1);
      return new Date(start.getTime() + offset * 86400000);
    }

    function showToast(message) {
      const el = document.createElement("div");
      el.className = "dk-toast";
      el.textContent = message;
      document.getElementById("toastContainer").appendChild(el);
      setTimeout(() => el.remove(), 2600);
    }

    function clampHighlights(highlights, textLength) {
      return (Array.isArray(highlights) ? highlights : [])
        .map((h, index) => ({
          id: h.id || `h-${index}-${h.start}-${h.end}`,
          start: Math.max(0, Math.min(textLength, Number(h.start) || 0)),
          end: Math.max(0, Math.min(textLength, Number(h.end) || 0)),
          text: String(h.text || "")
        }))
        .filter(h => h.end > h.start)
        .sort((a, b) => a.start - b.start);
    }

    function renderContent() {
      const text = entry.note || "";
      const highlights = clampHighlights(entry.highlights, text.length);
      content.innerHTML = "";
      let cursor = 0;
      highlights.forEach(h => {
        if (h.start < cursor) return;
        content.appendChild(document.createTextNode(text.slice(cursor, h.start)));
        const mark = document.createElement("mark");
        mark.className = "dk-highlight";
        mark.textContent = text.slice(h.start, h.end);
        mark.title = "Click to remove highlight";
        mark.dataset.highlightId = h.id;
        mark.addEventListener("click", () => removeHighlight(h.id));
        content.appendChild(mark);
        cursor = h.end;
      });
      content.appendChild(document.createTextNode(text.slice(cursor)));
    }

    function getTextOffset(container, node, offset) {
      const range = document.createRange();
      range.selectNodeContents(container);
      range.setEnd(node, offset);
      return range.toString().length;
    }

    function hideToolbar() {
      toolbar.classList.remove("is-visible");
      selectionRange = null;
    }

    content.addEventListener("mouseup", () => {
      const selection = window.getSelection();
      if (!selection || selection.isCollapsed || !selection.toString().trim()) {
        hideToolbar();
        return;
      }
      if (!content.contains(selection.anchorNode) || !content.contains(selection.focusNode)) return;
      const range = selection.getRangeAt(0);
      const start = getTextOffset(content, range.startContainer, range.startOffset);
      const end = getTextOffset(content, range.endContainer, range.endOffset);
      if (end <= start) return;
      selectionRange = { start, end, text: selection.toString() };
      const rect = range.getBoundingClientRect();
      toolbar.style.left = `${Math.max(12, Math.min(window.innerWidth - 130, rect.left + rect.width / 2 - 55))}px`;
      toolbar.style.top = `${Math.max(12, rect.top + window.scrollY - 52)}px`;
      toolbar.classList.add("is-visible");
    });

    document.addEventListener("mousedown", e => {
      if (!toolbar.contains(e.target) && !content.contains(e.target)) hideToolbar();
    });

    highlightBtn.addEventListener("click", async () => {
      if (!selectionRange || !entry) return;
      const overlap = clampHighlights(entry.highlights, entry.note.length).some(h => selectionRange.start < h.end && selectionRange.end > h.start);
      if (overlap) {
        showToast("That text overlaps an existing highlight.");
        return;
      }
      const highlights = [...(Array.isArray(entry.highlights) ? entry.highlights : []), {
        id: `h-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        start: selectionRange.start,
        end: selectionRange.end,
        text: selectionRange.text
      }];
      try {
        await updateDoc(doc(db, "entries", id), { highlights });
        entry.highlights = highlights;
        renderContent();
        window.getSelection()?.removeAllRanges();
        hideToolbar();
        showToast("Text highlighted.");
      } catch (err) {
        console.error(err);
        showToast("Couldn't save the highlight.");
      }
    });

    async function removeHighlight(highlightId) {
      const highlights = (entry.highlights || []).filter(h => h.id !== highlightId);
      try {
        await updateDoc(doc(db, "entries", id), { highlights });
        entry.highlights = highlights;
        renderContent();
        showToast("Highlight removed.");
      } catch (err) {
        console.error(err);
        showToast("Couldn't remove the highlight.");
      }
    }

    editBtn.addEventListener("click", () => {
      if (id) location.href = `index.html?edit=${encodeURIComponent(id)}`;
    });

    deleteBtn.addEventListener("click", async () => {
      if (!entry || !confirm("Delete this entry? This can't be undone.")) return;
      try {
        await deleteDoc(doc(db, "entries", id));
        location.href = "index.html";
      } catch (err) {
        console.error(err);
        showToast("Couldn't delete this entry.");
      }
    });

    async function loadEntry() {
      if (!id) {
        loadingState.style.display = "none";
        errorState.style.display = "block";
        return;
      }
      try {
        const snapshot = await getDoc(doc(db, "entries", id));
        if (!snapshot.exists()) throw new Error("not-found");
        entry = { id, ...snapshot.data() };
        document.title = `${entry.title || "Untitled entry"} — Daily Knows`;
        document.getElementById("entryTitleView").textContent = entry.title || "Untitled entry";
        document.getElementById("entryDate").textContent = dateStr(entry);
        document.getElementById("entryGregorian").textContent = formatGregorian(ethiopianToGregorian(entry.year, entry.month, entry.day));
        const tag = document.getElementById("entryTag");
        tag.textContent = entry.tag || "other";
        renderContent();
        loadingState.style.display = "none";
        entryView.style.display = "block";
      } catch (err) {
        console.error(err);
        loadingState.style.display = "none";
        errorState.style.display = "block";
      }
    }

    loadEntry();
  </script>
</body>
</html>
